<div class="add-recipe-container">
  <h1>Add New Recipe</h1>

  <!-- Import Section at top -->
  <div class="import-section">
    <h3>Import from URL (optional)</h3>
    <div class="url-input-group">
      <input
        type="text"
        placeholder="Paste recipe URL to auto-fill"
        [(ngModel)]="recipeUrl"
      >
      <button
        (click)="importFromUrl()"
        [disabled]="!recipeUrl() || isLoading()"
      >
        @if (isLoading()) {
          Importing...
        } @else {
          Import
        }
      </button>
    </div>
  </div>

  <div class="recipe-form">
    <div class="form-group">
      <label for="name">Recipe Name *</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="recipe().name"
      >
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        rows="3"
        [(ngModel)]="recipe().description"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="url">Recipe URL</label>
      <input
        type="url"
        id="url"
        [(ngModel)]="recipe().recipeUrl"
      >
    </div>

    <h3>Ingredients</h3>
    <ul class="ingredients-list">
      @for (ingredient of recipe().recipeIngredients; track $index) {
        <li>
          <input type="text" [(ngModel)]="ingredient.quantity" placeholder="Qty">
          <input type="text" [(ngModel)]="ingredient.unit" placeholder="Unit">
          <input type="text" [(ngModel)]="ingredient.name" placeholder="Ingredient">
          <button class="delete-btn" (click)="deleteIngredient($index)">
            <lucide-icon [img]="X" [size]="20" class="delete-ingredient-icon"></lucide-icon>
          </button>

        </li>
      }
      <button class="add-ingredient-button" (click)="addIngredient()">Add Ingredient</button>

    </ul>

    <div class="form-actions">
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
      <button class="save-btn" (click)="saveRecipe(recipe())">Save Recipe</button>
    </div>
  </div>
</div>
