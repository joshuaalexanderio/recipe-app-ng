<div class="max-w-[800px] mx-auto my-5 text-white">
  <h1 class="mb-5 ml-[30px] text-white">Add New Recipe</h1>

  <!-- Import Section at top -->
  <div class="recipe-section flex flex-wrap">
    <h3 class="text-white mb-4 text-base">Import from URL (optional)</h3>
    <div class="flex flex-wrap gap-2.5 w-full">
      <input
        type="text"
        placeholder="Paste recipe URL to auto-fill"
        [(ngModel)]="recipeUrl"
        class="input-field flex-1"
      >
      <button
        (click)="importFromUrl()"
        [disabled]="!recipeUrl() || isLoading()"
        class="px-6 py-3 bg-import text-black border-none rounded-md cursor-pointer font-medium transition-all duration-200 hover:bg-import-hover disabled:bg-cancel disabled:text-white-secondary disabled:cursor-not-allowed"
      >
        @if (isLoading()) { Importing... } @else { Import }
      </button>
    </div>
  </div>

  <div class="recipe-section">
    <div class="mb-5">
      <label for="name" class="block mb-2 font-medium text-white text-sm">Recipe Name *</label>
      <input type="text" id="name" [(ngModel)]="recipe().name" class="input-field w-full box-border">
    </div>

    <div class="mb-5">
      <label for="description" class="block mb-2 font-medium text-white text-sm">Description</label>
      <textarea id="description" rows="3" [(ngModel)]="recipe().description"
        class="input-field w-full box-border resize-y min-h-[80px]"></textarea>
    </div>

    <div class="mb-5">
      <label for="url" class="block mb-2 font-medium text-white text-sm">Recipe URL</label>
      <input type="url" id="url" [(ngModel)]="recipe().recipeUrl" class="input-field w-full box-border">
    </div>

    <h3 class="text-white my-5 text-base">Ingredients</h3>
    <ul class="list-none p-0 mb-[15px]">
      @for (ingredient of recipe().recipeIngredients; track $index) {
        <li class="flex gap-2 mb-2.5 py-2 border-b border-gray last:border-b-0">
          <input type="text" [(ngModel)]="ingredient.quantity" placeholder="Qty" class="input-field w-[60px] !p-2.5">
          <input type="text" [(ngModel)]="ingredient.unit" placeholder="Unit" class="input-field w-[70px] !p-2.5">
          <input type="text" [(ngModel)]="ingredient.name" placeholder="Ingredient" class="input-field flex-1 min-w-0 !p-2.5">
          <button
            (click)="deleteIngredient($index)"
            class="px-3 py-2 bg-delete text-white border-none rounded-md cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-delete-hover active:translate-y-px"
          >
            <lucide-icon [img]="X" [size]="20"></lucide-icon>
          </button>
        </li>
      }
      <button
        (click)="addIngredient()"
        class="w-full px-6 py-3 mt-2.5 bg-btn text-white border-none rounded-md cursor-pointer font-medium transition-all duration-200 hover:bg-btn-hover disabled:bg-cancel disabled:text-white-secondary disabled:cursor-not-allowed"
      >Add Ingredient</button>
    </ul>

    <div class="flex gap-2.5 justify-end mt-[30px] pt-5 border-t border-gray">
      <button
        (click)="cancel()"
        class="px-6 py-3 bg-cancel text-cancel-text border-none rounded-md cursor-pointer font-medium transition-all duration-200 hover:bg-cancel-hover hover:text-white"
      >Cancel</button>
      <button
        (click)="saveRecipe(recipe())"
        class="px-6 py-3 bg-btn text-white border-none rounded-md cursor-pointer font-medium transition-all duration-200 hover:bg-btn-hover"
      >Save Recipe</button>
    </div>
  </div>
</div>
