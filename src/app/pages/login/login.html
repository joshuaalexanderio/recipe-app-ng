<div class="min-h-screen bg-black flex items-center justify-center m-2">
  <div class="w-full max-w-sm bg-primary border border-gray rounded-xl p-8">
    <h1 class="text-lg font-semibold text-white mb-1">Recipe Raccoon</h1>
    <p class="text-xs text-white-secondary mb-6">Sign in to continue</p>

    @if (error) {
      <div class="mb-4 px-3 py-2 bg-red-900/30 border border-red-700/50 rounded-md text-xs text-red-400">
        {{ error }}
      </div>
    }

    <div class="flex flex-col gap-3">
      <input
        [(ngModel)]="username"
        type="text"
        placeholder="Username"
        class="bg-[#2a2a2a] border border-[#444] text-[#ccc] text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-[#7c5cbf]"
      />
      <input
        [(ngModel)]="password"
        type="password"
        placeholder="Password"
        (keydown.enter)="login()"
        class="bg-[#2a2a2a] border border-[#444] text-[#ccc] text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-[#7c5cbf]"
      />
      <button
        (click)="login()"
        class="bg-[#7c5cbf] hover:bg-[#5E35B1] text-white text-sm font-medium rounded-lg py-2 transition-colors"
      >
        Sign in
      </button>
    </div>
  </div>
</div>
