<div class="bg-bg flex p-6 gap-6">

  <!-- grid shrinks when drawer is open -->
  <div class="grid gap-6 items-start flex-1 transition-all duration-300"
       [ngClass]="selectedRecipe() ? 'grid-cols-2' : 'grid-cols-3'">
    @for (recipe of sortedRecipes(); track recipe.id) {
      <app-recipe-card
        [recipe]="recipe"
        [active]="selectedRecipe()?.id === recipe.id"
        (favoriteToggled)="handleFavoriteToggled($event)"
        (recipeDeleted)="handleRecipeDeleted($event)"
        (recipeIngredientDeleted)="handleRecipeIngredientDeleted(recipe.id, $event.id)"
        (recipeSelected)="selectedRecipe.set($event)"
      ></app-recipe-card>
    }
  </div>

  <!-- drawer -->
  @if (selectedRecipe()) {
    <app-recipe-drawer
      class="w-96 shrink-0"
      [recipe]="selectedRecipe()!"
      (closed)="selectedRecipe.set(null)"
      (ingredientDeleted)="handleRecipeIngredientDeleted(selectedRecipe()!.id, $event)"
    />
  }

</div>
