<div class="h-full text-[#e0e0e0]">

  <div class="flex items-start pl-2 gap-1">
    <a href="{{recipe.recipeUrl}}" rel="noopener noreferrer" target="_blank" class="hover:text-[#B388FF] flex-1">
      <h3>{{ recipe.name }} <lucide-icon
        [img]="Star"
        [class.favorite-filled]="isFavorite()"
        (click)="toggleFavorite(); $event.preventDefault()"
        class="text-muted favorite-star cursor-pointer transition-all hover:scale-110 active:scale-[1.01] inline-block align-middle"
      ></lucide-icon></h3>
    </a>
    <lucide-icon [img]="Pencil" class="icon-action" (click)="editRecipe()"></lucide-icon>
    <lucide-icon [img]="Trash2" class="icon-action" (click)="deleteRecipe()"></lucide-icon>
  </div>

  <p class="text-muted pl-2 text-sm leading-6 mt-2">{{ recipe.description }}</p>

  <div
    class="flex items-center cursor-pointer select-none mt-2 p-2 rounded-md transition-colors duration-200 hover:bg-[#7E57C2]"
    (click)="recipeSelected.emit(recipe)"
  >
    <h4 class="flex-1 text-white text-base ingredients-trigger">Ingredients:</h4>
    <lucide-icon class="pl-[3px] text-muted md:hidden" [img]="active ? ChevronUp : ChevronDown"></lucide-icon>
    <lucide-icon class="pl-[3px] text-muted hidden md:block" [img]="active ? ChevronLeft : ChevronRight"></lucide-icon>
  </div>
</div>
