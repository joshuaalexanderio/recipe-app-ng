<div class="mt-2 mx-4 flex justify-center">
  @if (signedIn()) {
  <button class="btn" [routerLink]="['/']">Home</button>
  }
    @if (todoistConnected()) {
    <div class="flex items-center mx-4 mt-3 px-3 py-2 bg-green-900/20 border border-green-700/40 rounded-md text-xs text-green-500">
      Todoist connected
    </div>
  } @else if (signedIn()) {
    <button (click)="todoistStore.connect()" class="btn bg-[#E34432] text-white hover:bg-[#B8301F] hover:-translate-y-0.5 hover:shadow-[0_3px_6px_#B8301F]">
      Connect to Todoist
    </button>
  }
  @if (signedIn()) {
  <button (click)="signOut()" class="btn">Sign out</button>

  <span class="flex-3"></span>
  <button class="btn" [routerLink]="['/add']">Add Recipe</button>
  <button class="btn bg-[#E34432] text-white hover:bg-[#B8301F] hover:-translate-y-0.5 hover:shadow-[0_3px_6px_#B8301F]" (click)="deleteAllRecipes()">Delete All</button>
  }
</div>
