<div class="flex flex-col mx-4">
  <div class="mt-2  flex justify-center">
    @if (signedIn()) {
      <button class="btn" [routerLink]="['/']">Home</button>
      <button (click)="signOut()" class="btn">Sign out</button>
      @if (todoistConnected()) {
        <button (click)="todoistStore.disconnect()" class="btn bg-disconnect text-white hover:bg-disconnect-hover hover:-translate-y-0.5 hover:shadow-[0_3px_6px_var(--color-disconnect-shadow)]">
          Disconnect Todoist
        </button>
      } @else {
        <button (click)="todoistStore.connect()" class="btn bg-connect text-primary hover:bg-connect-hover hover:-translate-y-0.5 hover:shadow-[0_3px_6px_var(--color-connect-shadow)]">
          Connect to Todoist
        </button>
      }
      <span class="flex-3"></span>
      <button class="btn" [routerLink]="['/add']">Add Recipe</button>
      <button class="btn bg-disconnect text-white hover:bg-disconnect-hover hover:-translate-y-0.5 hover:shadow-[0_3px_6px_var(--color-disconnect-shadow)]" (click)="deleteAllRecipes()">Delete All</button>
    }
  </div>
  <span class="text-white ml-2 mt-2">{{ greeting() }}, {{ signedIn()?.username }}</span>
</div>
